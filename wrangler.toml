name = "typewriter-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# From your GitHub OAuth App (this value is public, the secret is not)
CLIENT_ID = "PASTE_YOUR_CLIENT_ID"
# The ORIGIN of your site: no path, no trailing slash
ALLOWED_ORIGIN = "https://YOUR-USERNAME.github.io"

# The secret is NOT stored in this file. Set it with:
#   npx wrangler secret put CLIENT_SECRET
